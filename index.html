async function unzipEntries(buf){const b=new Uint8Array(buf);const dv=new DataView(buf);

  const x=xmlTextOf(e[key]);

   for(const cm of rm[1].matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>/g)){const attrs=cm[1],body=cm[2];let v='';
    if(/t="s"/.test(attrs)){const vm=body.match(/<v>(\d+)<\/v>/);v=vm?(shared[+vm[1]]||''):''}

async function makePdf(text,name){const jspdf=await loadJsPdf();const b64=await loadFont();
 const doc=new jspdf.jsPDF({unit:'mm',format:'a4'});
 doc.addFileToVFS('Amiri-Regular.ttf',b64);doc.addFont('Amiri-Regular.ttf','Amiri','normal');doc.setFont('Amiri');
 const PW=210,PH=297,M=16,CW=PW-2*M;let y=M+4;
 const newPage=()=>{doc.addPage();y=M+4};
 for(const p of parseMd(text)){const size=p.h===1?18:p.h===2?15:12.5;doc.setFontSize(size);
  const rtl=isAr(p.t);const logical=(p.bullet?'• ':'')+p.t;
  const words=logical.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;
   if(doc.getTextWidth(t)<=CW)cur=t;else{if(cur)lines.push(cur);cur=w}}
  if(cur)lines.push(cur);
  const lh=size*0.62;
  for(const ln of lines){if(y+lh>PH-M)newPage();
   if(rtl)doc.text(ln,PW-M,y,{align:'right'});else doc.text(ln,M,y,{align:'left'});
   y+=lh}
  y+=p.h?4:2}

/* ---------- WAV writer + Gemini TTS ---------- */
function wavFromPcm(pcm,rate){const h=new Uint8Array(44),d=new DataView(h.buffer);
 const ws=(o,s)=>{for(let i=0;i<s.length;i++)h[o+i]=s.charCodeAt(i)};
 ws(0,'RIFF');d.setUint32(4,36+pcm.length,true);ws(8,'WAVE');ws(12,'fmt ');
 d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,rate,true);
 d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);
 ws(36,'data');d.setUint32(40,pcm.length,true);
 return new Blob([h,pcm],{type:'audio/wav'})}
function pickTtsModel(){const t=(S.models||[]).filter(m=>/tts/i.test(m));t.sort((a,b)=>(/flash/i.test(b)?1:0)-(/flash/i.test(a)?1:0));return t[0]||null}
async function makeAudio(text){let m=pickTtsModel();
 if(!m&&S.key){try{S.models=await listModels(S.key);save();m=pickTtsModel()}catch(e){}}
 if(!m)throw new Error('مفيش موديل صوت (TTS) متاح على مفتاحك. افتح ⚙️ واضغط "جلب الموديلات" — ولو مفيش tts في القايمة يبقى توليد الصوت مش متاح لمفتاحك');
 if([...text].length>3500)throw new Error('النص طويل للصوت — قصّره تحت 3500 حرف');
 const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),60000);
 let r;try{r=await fetch(API+'models/'+m+':generateContent',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':S.key},
  body:JSON.stringify({contents:[{role:'user',parts:[{text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}}}})})}
 catch(e){clearTimeout(tm);throw new Error(e.name==='AbortError'?'توليد الصوت خد وقت طويل (timeout)':'فشل الاتصال: '+e.message)}
 clearTimeout(tm);const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.error&&j.error.message||('HTTP '+r.status)).slice(0,200));
 const part=j.candidates&&j.candidates[0]&&j.candidates[0].content&&(j.candidates[0].content.parts||[]).find(p=>p.inlineData);
 if(!part)throw new Error('الموديل مرجعش صوت');
 const raw=atob(part.inlineData.data);const b=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);
 const mt=part.inlineData.mimeType||'';const rate=+((mt.match(/rate=(\d+)/)||[])[1]||24000);
 if(/wav/i.test(mt))return new Blob([b],{type:'audio/wav'});
 return wavFromPcm(b,rate)}
/* ---------- Gemini Files API (large audio/video/pdf) ---------- */
async function uploadGeminiFile(file,onStatus){onStatus('⏳ برفع "'+file.name+'" ('+fmtSize(file.size)+') على Gemini...');
 const mime=file.type||'application/octet-stream';
 const st=await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files',{method:'POST',
  headers:{'x-goog-api-key':S.key,'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start',
   'X-Goog-Upload-Header-Content-Length':String(file.size),'X-Goog-Upload-Header-Content-Type':mime,'Content-Type':'application/json'},
  body:JSON.stringify({file:{display_name:file.name.slice(0,80)}})});
 if(!st.ok){const t=await st.text().catch(()=> '');throw new Error('فشل بدء الرفع: '+t.slice(0,150))}
 const up=st.headers.get('x-goog-upload-url');if(!up)throw new Error('فشل بدء الرفع (مفيش upload url)');
 onStatus('⏳ برفع "'+file.name+'"... ممكن ياخد وقت على حسب الحجم والنت');
 const r=await fetch(up,{method:'POST',headers:{'X-Goog-Upload-Offset':'0','X-Goog-Upload-Command':'upload, finalize','Content-Type':mime},body:file});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.file)throw new Error('فشل الرفع: '+((j.error&&j.error.message)||('HTTP '+r.status)));
 const f=j.file;let state=f.state,tries=0;
 while(state==='PROCESSING'&&tries<50){await new Promise(z=>setTimeout(z,3000));tries++;
  onStatus('⏳ Gemini بيحضّر "'+file.name+'" للتحليل...');
  const g=await fetch(API+f.name,{headers:{'x-goog-api-key':S.key}});const gj=await g.json().catch(()=>({}));state=gj.state||state}
 if(state!=='ACTIVE')throw new Error('الملف اترفع بس Gemini لسه بيعالجه — ابعت تاني بعد دقيقة');
 return{uri:f.uri,mime:f.mimeType||mime}}
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();
 r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('مش قادر أقرا الملف'));r.readAsDataURL(file)})}
/* ---------- attachments ---------- */
const INLINE_B64=12*1024*1024,HARD_CAP=200*1024*1024,TEXT_MAX=150000;
let pending=[];
function classify(file){const n=file.name.toLowerCase(),mt=(file.type||'').toLowerCase();
 if(/\.(txt|md|json|csv|log)$/.test(n)||mt.startsWith('text/'))return 'text';
 if(/\.docx$/.test(n))return 'docx';if(/\.xlsx$/.test(n))return 'xlsx';
 if(/\.doc$|\.xls$|\.pptx?$/.test(n))return 'old';
 if(mt.startsWith('image/'))return 'image';if(mt==='application/pdf'||/\.pdf$/.test(n))return 'pdf';
 if(mt.startsWith('audio/'))return 'audio';if(mt.startsWith('video/'))return 'video';return 'unknown'}
async function extractAttText(a){let tx;
 if(a.kind==='text')tx=await a.file.text();
 else if(a.kind==='docx')tx=await extractDocxText(await a.file.arrayBuffer());
 else tx=await extractXlsxText(await a.file.arrayBuffer());
 tx=tx.trim();if(tx.length>TEXT_MAX)tx=tx.slice(0,TEXT_MAX)+'\n...[اتقطع لطول الملف]';
 if(!tx)throw new Error('مفيش نص اتستخرج من الملف');
 return tx}
function renderChips(){const c=$('chips');c.innerHTML='';c.style.display=pending.length?'flex':'none';
 pending.forEach((a,i)=>{const d=document.createElement('span');d.className='chip';
  d.append(document.createTextNode('📎 '+a.file.name+' ('+fmtSize(a.file.size)+')'));
  const x=document.createElement('button');x.type='button';x.textContent='✕';
  x.onclick=()=>{pending.splice(i,1);renderChips()};d.append(x);c.append(d)})}
$('att').onclick=()=>$('fi').click();
$('fi').onchange=()=>{for(const f of $('fi').files){
  const k=classify(f);
  if(k==='unknown'||k==='old'){add('e','نوع الملف "'+f.name+'" مش مدعوم. المدعوم: صور، PDF، صوت، فيديو، وملفات نصية/مكتب: txt, csv, docx, xlsx'+(k==='old'?' — الملفات القديمة (.doc/.xls) حوّلها لـ docx/xlsx الأول':''));continue}
  if(f.size>HARD_CAP){add('e','الملف "'+f.name+'" أكبر من 200 ميجا — قلّل حجمه');continue}
  if(pending.length>=5){add('e','أقصى عدد مرفقات في الرسالة: 5');break}
  pending.push({file:f,kind:k,mime:f.type||(k==='pdf'?'application/pdf':'application/octet-stream')})}

/* ---------- file block from model reply ---------- */
const AUDIO_RE=/صوت|أوديو|اوديو|سجّ?ل|تسجيل|اقرأ|اقرا|استمع|سمع|نطق|انطق|اتكلم|تكلم|audio|voice|mp3|wav|aloud|speak|spoken|listen/i;
function speechText(t){let s=String(t).replace(/<<<FILE[\s\S]*?<<<END>>>/g,' ').replace(/<<<[\s\S]*?>>>/g,' ');
 s=s.replace(/[#*`_>~]/g,'').replace(/https?:\/\/\S+/g,' ');
 s=s.replace(/\s+/g,' ').trim();const arr=[...s];
 if(arr.length>3400){const cut=arr.slice(0,3400).join('');const m=cut.match(/^([\s\S]*[.!؟?])/);s=m?m[1]:cut}

function extractFileBlock(txt){const m=txt.match(/<<<FILE\s+type="(docx|xlsx|pdf|audio)"\s+name="([^"<>]{1,80})">>>([\s\S]*?)<<<END>>>/);

async function deliverFile(fb){let blob;const mime={docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',audio:'audio/wav'}[fb.type];
 if(fb.type==='docx')blob=makeDocx(fb.content,fb.name);
 else if(fb.type==='xlsx')blob=makeXlsx(fb.content);
 else if(fb.type==='pdf')blob=await makePdf(fb.content,fb.name);
 else blob=await makeAudio(fb.content);
 if(!/\.(docx|xlsx|pdf|wav)$/i.test(fb.name))fb.name+={docx:'.docx',xlsx:'.xlsx',pdf:'.pdf',audio:'.wav'}[fb.type];

/* ---------- model calls ---------- */
function baseBody(contents){return{systemInstruction:{parts:[{text:SYS+(S.co?'\n\nCompany info:\n'+S.co:'')}]},contents,generationConfig:{maxOutputTokens:8192}}}
async function callModel(m,contents,onTok){
 const b=baseBody(contents);let last;
 for(const tc of[{thinkingBudget:0},{thinkingLevel:'minimal'},null]){
  if(tc)b.generationConfig.thinkingConfig=tc;else delete b.generationConfig.thinkingConfig;
  try{return await streamCall(m,b,onTok)}catch(x){last=x;if(x.status===400&&/thinking|generationConfig|invalid.*argument/i.test(String(x.message)))continue;throw x}}

async function streamCall(m,body,onTok){
 const ac=new AbortController();let to=false;
 const kill=()=>{to=true;ac.abort()};let tm=setTimeout(kill,30000);
 const mkErr=(st,raw)=>{let msg=raw;try{msg=JSON.parse(raw).error?.message||raw}catch(e){}const x=new Error(String(msg).slice(0,300));x.status=st;return x};
 const toErr=s=>{const x=new Error(s);x.timeout=true;return x};
 let r;
 try{r=await fetch(API+'models/'+m+':streamGenerateContent?alt=sse',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify(body)})}
 catch(e){clearTimeout(tm);if(to||e.name==='AbortError')throw toErr('timeout: مفيش رد خلال 30 ثانية');throw e}
 if(!r.ok){let raw='';try{raw=await r.text()}catch(e){}clearTimeout(tm);throw mkErr(r.status,raw.slice(0,500))}

   let i;while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);
    for(const ln of ev.split('\n')){if(!ln.startsWith('data:'))continue;const d=ln.slice(5).trim();if(!d||d==='[DONE]')continue;
     try{const j=JSON.parse(d);meta=j;const ps=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[];let c='';
      for(const p of ps){if(p&&typeof p.text==='string'&&!p.thought)c+=p.text}

function dispTok(w){return t=>{const i=t.indexOf('<<<FILE');

/* ---------- submit ---------- */
$('f').onsubmit=async e=>{e.preventDefault();
 const v=$('t').value.trim();
 if(!v&&!pending.length)return;

 const atts=pending.splice(0);renderChips();$('t').value='';
 add('u',(v?v+'\n':'')+atts.map(a=>'📎 '+a.file.name+' ('+fmtSize(a.file.size)+')').join('\n'));
 const w=add('a','...');const t0=Date.now();let curM='',streaming=false;
 const iv=setInterval(()=>{if(!streaming&&w.className=='m a')w.textContent=(w.textContent.startsWith('⏳')?w.textContent.split('\n')[0]:'...')+' '+Math.floor((Date.now()-t0)/1000)+'s'+(curM?' ('+curM+')':'')},1000);
 try{
  const parts=[],notes=[];
  for(const a of atts){try{
   if(a.kind==='text'||a.kind==='docx'||a.kind==='xlsx'){parts.push({text:'[محتوى الملف المرفق: '+a.file.name+']\n'+await extractAttText(a)});notes.push(a.file.name)}
   else if(a.file.size<=INLINE_B64){parts.push({inlineData:{mimeType:a.mime,data:await fileToB64(a.file)}});notes.push(a.file.name)}
   else{const up=await uploadGeminiFile(a.file,s=>{w.textContent=s});parts.push({fileData:{mimeType:up.mime,fileUri:up.uri}});notes.push(a.file.name)}
  }catch(x){clearInterval(iv);w.className='m e';w.textContent='فشل تجهيز "'+a.file.name+'": '+x.message;return}}
  if(v)parts.push({text:v});
  const chosen=S.model||DEF;
  let fb=S.models;if(!fb){try{fb=await listModels(S.key);S.models=fb;save()}catch(x){fb=[]}}
  const bad=/image|tts|live|audio|embed|robotics|computer|imagen|veo|aqa|gemma|customtools/i;
  fb=(fb||[]).filter(m=>/flash/i.test(m)&&!bad.test(m)&&m!==chosen).sort((a,b)=>/lite/i.test(a)-/lite/i.test(b)).slice(0,5);

   try{const r=await callModel(m,contents,dispTok(w));ok=true;used=m;txt=r.text;meta=r.meta;break}
   catch(x){const msg=(x.status?x.status+' ':'')+String(x.message||x);errs.push(m+' → '+msg);
    if(/api.key|PERMISSION_DENIED|unauthenticated/i.test(msg))break;

    else if(x.status===429||x.status===503)w.textContent=m+' عليه ضغط دلوقتي، بجرب موديل تاني...';

  if(!a&&!fblk){const c0=meta&&meta.candidates&&meta.candidates[0]||{};const pf=meta&&meta.promptFeedback;
   const d='finishReason='+(c0.finishReason||'-')+'; block='+(pf&&pf.blockReason||'-')+'; candidates='+((meta&&meta.candidates||[]).length)+'; raw='+JSON.stringify(meta||{}).slice(0,400);
   a='(الرد فاضي) '+d;w.textContent=a}

   catch(x){const em=(fblk.type==='audio'?'فشل توليد الصوت: ':'فشل إنشاء الملف: ')+x.message;add('e',em);mtxt=(a?a+'\n':'')+'['+em+']'}}

window.__gen={makeDocx,makeXlsx,makePdf,zipStore,unzipEntries,extractDocxText,extractXlsxText,extractFileBlock,parseCsv,wavFromPcm,AUDIO_RE,speechText,dl};
